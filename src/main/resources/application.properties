spring.application.name=api_social_meli

# MySQL (compose)
spring.datasource.url=jdbc:mysql://localhost:3306/social_meli?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=user
spring.datasource.password=user123

#spring.jpa.hibernate.ddl-auto=validate

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG

# Mongo (compose) - com auth
spring.data.mongodb.uri=mongodb://root:root123@localhost:27017/socialmeli?authSource=admin

spring.profiles.active=dev

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.orm.jdbc.bind=TRACE
#logging.level.com.zaxxer.hikari=DEBUG
#debug=true

# SpringDoc OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# Fix Swagger UI pattern matching issue
spring.mvc.pathmatch.matching-strategy=ant_path_matcher